name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Publishes through npm Trusted Publishing (OIDC). No NPM_TOKEN secret is
# stored; configure the trusted publisher on npm for this repository, the
# publish.yml workflow, and the `npm` environment. Provenance uses the OIDC
# token below.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Node 22.19 ships npm 10, while Trusted Publishing needs npm 11.5.1+.
      - run: npm install -g npm@^11.5.1
      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          node -e '
            const version = require("./package.json").version;
            if (`v${version}` !== process.env.GITHUB_REF_NAME) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match v${version}`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # prepublishOnly runs lint, typecheck, i18n, the real-Pi integration test,
      # and the tarball check before anything is uploaded.
      - run: npm publish --provenance --access public
