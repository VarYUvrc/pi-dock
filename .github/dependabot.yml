version: 2

# Keep routine dependency churn to one grouped PR per ecosystem, once a month.
# Dependabot security updates remain independently enabled in the repository
# settings and are not limited by these version-update rules.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
